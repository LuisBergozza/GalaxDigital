      .hero-glow {

        width: min(45vw, 560px);

      }
      .hero-glow-secondary {
        width: 220px;
        height: 220px;
        right: 42%;
        bottom: 5%;
        background: rgba(157, 110, 255, 0.18);
        filter: blur(70px);
        animation: heroBreathe 9s ease-in-out 1s infinite reverse;
      }
      .hero-orbit {
        border: 1px solid rgba(157, 110, 255, 0.24);
        border-radius: 50%;
        right: 18%;
        top: 24%;
        transform: rotate(-24deg);
        box-shadow: 0 0 30px rgba(83, 0, 255, 0.12);
      }
      .hero-orbit-one {
        width: min(42vw, 520px);
        height: min(25vw, 300px);
        animation: heroOrbit 18s linear infinite;
      }
      .hero-orbit-two {
        width: min(34vw, 420px);
        height: min(52vw, 620px);
        right: 25%;
        top: 8%;
        transform: rotate(42deg);
        border-color: rgba(123, 44, 255, 0.18);
        animation: heroOrbit 24s linear infinite reverse;
      }
      .hero-star {
        background: #d9c8ff;
        box-shadow: 0 0 10px 2px rgba(157, 110, 255, 0.8);
        animation: heroTwinkle 3.5s ease-in-out infinite;
      }
      .hero-method {
        right: 28%;
        top: 25%;
        width: min(30vw, 380px);
        min-height: 330px;
        padding: 30px;
        color: var(--hero-ink);
        background: linear-gradient(145deg, rgba(20, 12, 38, 0.76), rgba(5, 5, 5, 0.46));
        border: 1px solid rgba(214, 194, 255, 0.24);
        border-radius: 18px;
        box-shadow: 0 20px 80px rgba(4, 0, 20, 0.45), inset 0 1px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        transform: perspective(900px) rotateY(-8deg) rotateX(2deg);
      }
      .hero-method::before,
      .hero-method::after {
        content: '';
        position: absolute;
        height: 1px;
        background: linear-gradient(90deg, transparent, #9d6eff, transparent);
        box-shadow: 0 0 12px #9d6eff;
      }
      .hero-method::before {
        width: 42%;
        top: -1px;
        left: 29%;
        animation: heroNeonSweep 5s ease-in-out infinite;
      }
      .hero-method::after {
        width: 54%;
        bottom: -1px;
        left: 23%;
        animation: heroNeonSweep 5s ease-in-out 1.8s infinite reverse;
      }
      .hero-method-line {
        width: 32px;
        height: 3px;
        margin-bottom: 24px;
        background: #9d6eff;
        box-shadow: 0 0 14px #9d6eff;
      }
      .hero-method-eyebrow {
        color: rgba(238, 229, 255, 0.82);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .hero-method-divider {
        height: 1px;
        margin: 16px 0 20px;
        background: rgba(224, 207, 255, 0.24);
      }
      .hero-method h3 {
        margin: 0 0 26px;
        font-size: clamp(22px, 2.2vw, 32px);
        line-height: 1.08;
        text-transform: capitalize;
      }
      .hero-method ul {
        display: grid;
        gap: 15px;
        margin: 0;
        padding: 0;
        list-style: none;
        color: rgba(238, 229, 255, 0.78);
        font-size: 13px;
      }
      .hero-method li {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hero-method li span {
        display: inline-grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border: 1px solid rgba(190, 157, 255, 0.82);
        border-radius: 50%;
        color: #e2d3ff;
        font-size: 10px;
      }
      @keyframes heroBreathe {
        0%, 100% { opacity: 0.65; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes heroNeonSweep {
        0%, 100% { left: 12%; width: 34%; opacity: 0.55; }
        50% { left: 38%; width: 52%; opacity: 1; }
      }
      @keyframes heroOrbit {
        from { transform: rotate(-24deg) translateX(0); }
        to { transform: rotate(336deg) translateX(0); }
      }
      @keyframes heroTwinkle {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @media (max-width: 767px) {
        .hero-visual {
          opacity: 0.62;
          mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 82%, transparent 100%);
        }
        .hero-method {
          right: -8%;
          top: 44%;
          width: 280px;
          min-height: 270px;
          padding: 22px;
          transform: rotate(-4deg) scale(0.8);
          transform-origin: top right;
        }
        .hero-method h3 { font-size: 24px; }
        .hero-orbit-one { width: 360px; height: 220px; right: -20%; }
        .hero-orbit-two { width: 300px; height: 440px; right: -5%; }
      }

      .theme-light .hero-visual {

      }
      .theme-light .hero-method {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.82), rgba(246, 242, 255, 0.7));
